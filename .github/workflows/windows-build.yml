name: Windows build

# Build file .exe trên máy Windows thật của GitHub, chạy thử rồi đính kèm kết quả (mục Artifacts).
on:
  push:
    branches: [main]
    paths-ignore: ["download/**", "docs/**", "**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: python -m pip install -r requirements-build.txt pytest

      - name: Kiểm thử
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Đóng gói exe
        run: python -m PyInstaller --noconfirm --clean hstat.spec

      - name: Chạy thử exe (mở app, đợi 25 giây, chụp màn hình)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\HeptacontakaienneagonStat.exe" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\screenshot.png")
          if ($p.HasExited) {
            Write-Error "App đã thoát/crash sau khi mở (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Host "App vẫn đang chạy sau 25 giây: OK"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HeptacontakaienneagonStat-windows
          path: |
            dist/HeptacontakaienneagonStat.exe
            screenshot.png
